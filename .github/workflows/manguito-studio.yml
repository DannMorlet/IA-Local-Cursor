name: Manguito Studio · check and package

on:
  push:
    paths:
      - 'manguito/**'
      - 'tests/**'
      - '.github/workflows/manguito-studio.yml'
  pull_request:
    paths:
      - 'manguito/**'
      - 'tests/**'
      - '.github/workflows/manguito-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check manguito/web/app.js

  package-windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Instalar empaquetador
        run: python -m pip install "pyinstaller>=6,<7"
      - name: Crear ejecutable de prueba
        run: pyinstaller --noconfirm --clean --onefile --console --name Manguito-Studio --paths . --add-data "manguito/web;manguito/web" manguito/desktop.py
      - name: Comprobar resultado
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/Manguito-Studio.exe')) { throw "No se generó el ejecutable" }
          Get-Item 'dist/Manguito-Studio.exe' | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: Manguito-Studio-Windows-preview
          path: dist/Manguito-Studio.exe
          retention-days: 14
