name: Matick Studio LM - Cloud y DirectX 12

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud:
    name: Contrato y pruebas cloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar sintaxis Python
        run: python -m compileall -q cloud
      - name: Pruebas API y persistencia
        env:
          PYTHONPATH: cloud
        run: python -m unittest discover -s cloud/tests -v
      - name: Pruebas del comparador de solo lectura
        env:
          PYTHONPATH: tools
        run: python -m unittest discover -s tools/tests -v

  windows-dx12:
    name: Compilar interfaz DirectX 12 x64
    # Pin VS 2022: windows-latest ahora incluye Visual Studio 2026
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configurar MSVC / CMake
        shell: pwsh
        run: cmake -S windows -B out/build -G "Visual Studio 17 2022" -A x64
      - name: Compilar ejecutable
        shell: pwsh
        run: cmake --build out/build --config Release --parallel
      - name: Construir paquete portable ligero
        shell: pwsh
        run: .\\tools\\package_portable.ps1 -ExePath .\\out\\build\\Release\\MatickStudioLM.exe -OutputDir .\\out\\dist
      - name: Publicar paquete ligero verificado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MatickStudioLM-Windows-x64-Portable
          path: out/dist/
          if-no-files-found: error
          retention-days: 30

  toolhub:
    name: Matick ToolHub / pruebas SDK mock + MCP stdio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar SDK oficial sin scripts de terceros
        working-directory: integrations/toolhub
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Comprobar importación del SDK
        working-directory: integrations/toolhub
        run: node --input-type=module -e "import('@lmstudio/sdk').then(m => { if (!m.LMStudioClient) process.exit(1); console.log('SDK importado'); })"
      - name: Comprobar registro MCP y adaptador sin servidores externos
        run: node --test integrations/toolhub/tests/*.test.mjs
